services:
  - type: web
    name: nightwave-chat
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: nightwave-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /app/data/nightwave.db
      - key: FORCE_SECURE_COOKIE
        value: '1'
